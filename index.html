<title>いきる会 | IKIRU KAI</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D6;
    --paper-light: #F8F4E9;
    --ink: #2B2723;
    --ink-soft: #55504A;
    --sprout: #55694A;
    --soil: #8F7248;
    --line: #CEC2A4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(143,114,72,0.06), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(85,105,74,0.07), transparent 45%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  .crest {
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }

  .crest img {
    width: 148px;
    height: 148px;
    object-fit: contain;
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.08em;
    text-align: center;
    margin: 4px 0 2px;
  }

  .romaji {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.32em;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }

  .tagline {
    text-align: center;
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink-soft);
    margin: 0 auto 34px;
    max-width: 300px;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 0 auto 30px;
    width: 64px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: block;
    position: relative;
    background: var(--paper-light);
    border: 1px solid var(--line);
    padding: 17px 22px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .link-card:hover {
    transform: translateY(-1px);
  }

  .link-card .label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .link-card .name {
    font-family: 'Noto Serif JP', serif;
    font-size: 16.5px;
    font-weight: 500;
  }

  .link-card .sub {
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .link-card::after {
    content: "";
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 0;
    height: 2px;
    background: var(--sprout);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  .link-card.line::after { background: var(--sprout); }
  .link-card.insta::after { background: var(--soil); }
  .link-card.hp::after { background: var(--ink-soft); }

  .link-card:hover::after {
    transform: scaleX(1);
  }

  footer {
    text-align: center;
    margin-top: 44px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-card, .link-card::after { transition: none; }
  }
</style>
</head>
